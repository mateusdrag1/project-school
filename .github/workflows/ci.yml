name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: school
          POSTGRES_DB: school
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d school"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      NODE_ENV: test
      PORT: 3000

      DATABASE_USER: admin
      DATABASE_PASSWORD: school
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: school

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test
