services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-school-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_USER: admin
      DATABASE_PASSWORD: school
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: school
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: project-school-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d school"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
